[project]
name = "especulai"
version = "0.1.0"
description = "Plataforma de estimativa de preços de imóveis com Machine Learning"
requires-python = ">=3.11"
# Somente o necessário para SERVIR predições. Scraping e enriquecimento
# geoespacial vivem no extra `pipeline` — geopandas + scrapy sozinhos dobram o
# tamanho da imagem de deploy e nada disso roda em tempo de inferência.
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    # Inferência
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
pipeline = [
    # Modelos alternativos avaliados nos notebooks
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    # Scraping
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "scrapy>=2.11.0",
    # Geoespacial
    "geopy>=2.4.0",
    "overpy>=0.7",
    "geopandas>=1.1.4",
    "scipy>=1.17.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "basedpyright>=1.14.0",
]

[project.scripts]
especulai-api = "apps.api.main:app"
especulai-pipeline = "ml.pipeline.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "ml", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["apps", "ml"]
exclude = ["**/__pycache__", "**/node_modules", "notebooks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
